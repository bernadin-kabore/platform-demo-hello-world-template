name: service-build

# Build one service's container image, prove it is safe, and publish it as an
# immutable, signed, attested artifact. Nothing in this file deploys anything.
#
# ---------------------------------------------------------------------------
# THIS FILE IS THE IDENTITY KYVERNO VERIFIES. READ THIS BEFORE MOVING IT.
# ---------------------------------------------------------------------------
#
# `cosign sign` below is keyless: it exchanges this workflow's GitHub OIDC
# token for a short-lived Fulcio certificate and records the signature in
# Rekor. The certificate's subject is taken from the token's `job_workflow_ref`
# claim — which, for a reusable workflow, is *this* file's ref, not the caller's.
# So every image the platform produces is signed as:
#
#   https://github.com/bernadin-kabore/platform-demo-hello-world-template/\
#     .github/workflows/service-build.yml@refs/heads/main
#
# and platform-demo-gitops/apps/kyverno/policies/{require-signed-images,
# require-sbom-attestation}.yaml pin exactly that string. Renaming this file,
# moving these steps back into a caller, or changing the branch it is called
# from all change the recorded identity, and the next pod to be admitted is
# refused with a signature verification failure.
#
# That coupling buys something. The previous arrangement signed from each
# service repository's own ci.yml, so the policy had to accept the wildcard
# `bernadin-kabore/*/.github/workflows/ci.yml@refs/heads/main` — any repository
# in the account with a ci.yml on main satisfied it. Pinning one
# platform-owned file replaces that wildcard with a single exact path.
#
# ---------------------------------------------------------------------------
# Stage ordering is load-bearing
# ---------------------------------------------------------------------------
#
# build (not pushed) -> scan -> push -> SBOM -> sign -> attest.
#
# The image is built locally and scanned before it is allowed to exist in ECR,
# so a HIGH/CRITICAL CVE never reaches the registry at all rather than reaching
# it and being caught later. Do not reorder these to save a build.

on:
  workflow_call:
    inputs:
      service:
        description: Service name — names the artifact this workflow hands back
        type: string
        required: true
      working-directory:
        description: Docker build context, relative to the repository root
        type: string
        required: true
      ecr-repository:
        description: Full ECR repository URI for this service
        type: string
        required: true
      aws-region:
        type: string
        required: true
      image-tag:
        description: Immutable tag to publish — the source commit's short SHA
        type: string
        required: true
    secrets:
      aws-role-arn:
        description: Role assumed via GitHub OIDC; may push only this application's ECR repositories
        required: true
    outputs:
      digest:
        description: The published image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  id-token: write # OIDC federation to AWS + Sigstore keyless signing, no static secrets
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: false
          load: true
          tags: ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
          severity: HIGH,CRITICAL
          exit-code: "1" # fails the build — nothing with a known HIGH/CRITICAL CVE ships
          # Without this, the gate is not what it claims to be.
          #
          # trivy-action ignores the severity filter when format is sarif, so
          # that the uploaded report carries every finding -- it announces
          # "Building SARIF report with all severities". exit-code: 1 then
          # fires on that unfiltered set, so a single LOW advisory fails the
          # build even though the policy above says HIGH and CRITICAL.
          #
          # That went unnoticed because the Go service runs on
          # distroless/static, which has no OS packages and therefore no
          # findings at any severity. The first Node image, whose base
          # legitimately carries a couple of unfixable LOWs, was refused with
          # nothing in the log to say why.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image-${{ inputs.service }}.sarif

      # Say what was actually found when the scan refuses an image.
      #
      # The scan above writes SARIF to a file, so a failure prints nothing to
      # the log: the job stops with "exit code 1" and the findings are only
      # visible in code scanning, which lags and deduplicates against alerts
      # from earlier runs. That turns a one-line answer into an investigation.
      # This re-runs the same scan as a table, only on failure, and never
      # affects the outcome.
      - name: Show what the scan refused
        if: failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-${{ inputs.service }}.sarif
          category: trivy-image-${{ inputs.service }}

      # Is this tag already in the registry?
      #
      # The tag is the commit SHA and ECR tags are immutable, so a run that
      # pushed and then failed further down -- signing is two calls to shared
      # public infrastructure, so it does fail -- leaves the tag claimed. A
      # re-run of that build would be refused at the push with "already exists
      # ... cannot be overwritten", which turns a transient network fault into
      # a commit that can never go green.
      #
      # Finding the tag already present means this is a resumed run, not a
      # conflict: within one repository nothing else publishes this tag. The
      # digest already in the registry is the one to sign, because it is the
      # one that will be deployed -- even if a rebuild would now produce
      # different bytes.
      - name: Check whether this tag is already published
        id: published
        run: |
          set -euo pipefail
          repository="${ECR_REPOSITORY#*/}"
          digest=$(aws ecr describe-images \
            --repository-name "$repository" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)

          if [ -n "$digest" ] && [ "$digest" != "None" ]; then
            echo "Tag already published at ${digest}; resuming without pushing."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.image-tag }}

      - name: Push image
        id: push
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: true
          tags: ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}

      # One digest for everything downstream, whether it was just pushed or
      # was already there from an earlier attempt.
      - name: Resolve the published digest
        id: image
        run: |
          set -euo pipefail
          if [ "${{ steps.published.outputs.exists }}" = "true" ]; then
            digest="${{ steps.published.outputs.digest }}"
          else
            digest="${{ steps.image.outputs.digest }}"
          fi
          if [ -z "$digest" ]; then
            echo "::error::No image digest resolved; refusing to sign nothing."
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0.17.2
        with:
          image: "${{ inputs.ecr-repository }}@${{ steps.image.outputs.digest }}"
          format: spdx-json
          output-file: sbom-${{ inputs.service }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Retried, because Fulcio is shared infrastructure and this pipeline
      # signs services in parallel.
      #
      # cosign sign and cosign attest are two separate round-trips to
      # fulcio.sigstore.dev per service. A multi-service build makes several of
      # them at once, and the public good instance resets connections under
      # load -- observed as
      #
      #   getting key from Fulcio: retrieving cert: ... read: connection reset
      #
      # after the image had already been pushed. Retrying here is what keeps
      # that from stranding a commit; the check above is what lets a re-run get
      # this far at all.
      - name: Sign image (keyless, via GitHub OIDC + Fulcio/Rekor)
        run: |
          set -euo pipefail
          image="${{ inputs.ecr-repository }}@${{ steps.image.outputs.digest }}"
          for attempt in 1 2 3; do
            if cosign sign --yes "$image"; then
              exit 0
            fi
            echo "::warning::cosign sign attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::cosign sign failed after 3 attempts"
          exit 1

      - name: Attest SBOM to the image
        run: |
          set -euo pipefail
          image="${{ inputs.ecr-repository }}@${{ steps.image.outputs.digest }}"
          for attempt in 1 2 3; do
            if cosign attest --yes \
                 --predicate sbom-${{ inputs.service }}.spdx.json \
                 --type spdxjson \
                 "$image"; then
              exit 0
            fi
            echo "::warning::cosign attest attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::cosign attest failed after 3 attempts"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service }}
          path: sbom-${{ inputs.service }}.spdx.json

      # The image reference, handed to the GitOps PR job as a file rather than
      # a job output. A matrix job's outputs collapse to whichever copy of the
      # job finished last, so N services building in parallel would produce one
      # surviving digest and silently deploy the wrong image for the rest.
      # One artifact per service cannot collide.
      - name: Record the published image reference
        run: |
          cat > image-ref-${{ inputs.service }}.json <<JSON
          {
            "service": "${{ inputs.service }}",
            "repository": "${{ inputs.ecr-repository }}",
            "tag": "${{ inputs.image-tag }}",
            "digest": "${{ steps.image.outputs.digest }}"
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: image-ref-${{ inputs.service }}
          path: image-ref-${{ inputs.service }}.json
