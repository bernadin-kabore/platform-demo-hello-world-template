name: ci

on:
  pull_request:
    branches: [main, develop, "release/**"]
  push:
    branches: [main]
    paths-ignore: ["chart/values.yaml"]

permissions:
  contents: write
  id-token: write
  security-events: write
  pull-requests: write

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ---------------------------------------------------------------------
  # 1. Tests
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test

  coverage:
    uses: bernadin-kabore/platform-demo-hello-world-template/.github/workflows/code-coverage.yml@main
    with:
      language: java
      coverage-threshold: 70

  # ---------------------------------------------------------------------
  # 2. SAST
  # ---------------------------------------------------------------------
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B package -DskipTests
      - uses: github/codeql-action/analyze@v3

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # 3. SCA
  # ---------------------------------------------------------------------
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.event.repository.name }}
          path: pom.xml
          format: SARIF
          args: --failOnCVSS 7

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-fs-results.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif

  # ---------------------------------------------------------------------
  # 4. Build, scan, sign, SBOM
  # ---------------------------------------------------------------------
  build-scan-sign:
    needs: [test, sast, sca, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image-results.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: "${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}"

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ---------------------------------------------------------------------
  # 5. Update the Helm chart with the new image
  # ---------------------------------------------------------------------
  update-manifests:
    needs: build-scan-sign
    runs-on: ubuntu-latest
    steps:
      # main now requires PRs + passing checks + signed commits (see the
      # platform:github:branch-protection scaffolder step this repo was
      # created with). A plain git push here would be rejected — this
      # generates a short-lived installation token for the platform deploy
      # bot, which the ruleset explicitly exempts, instead of a long-lived PAT.
      - name: Mint platform-deploy-bot installation token
        id: deploy-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.PLATFORM_DEPLOY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.deploy-bot-token.outputs.token }}

      - name: Bump image tag + digest in chart/values.yaml
        run: |
          TAG="${{ needs.build-scan-sign.outputs.image_tag }}"
          DIGEST="${{ needs.build-scan-sign.outputs.image_digest }}"
          yq -i ".image.tag = \"${TAG}\" | .image.digest = \"${DIGEST}\"" chart/values.yaml

      - name: Commit as platform-deploy-bot
        run: |
          git config user.name "platform-deploy-bot[bot]"
          git config user.email "platform-deploy-bot[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "ci: deploy ${{ needs.build-scan-sign.outputs.image_tag }}" || exit 0
          git push
