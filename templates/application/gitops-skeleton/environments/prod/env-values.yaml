# Environment-wide desired state for prod.
#
# Advanced only by a promotion pull request from staging, and only with an approving review.
#
# What belongs here: anything true of every service in this environment —
# capacity, the telemetry environment name, the hostname suffix. What does not:
# image references, which are per service and live in services/.
otel:
  environment: prod
  serviceNamespace: "${{ values.owner }}"

owner: "${{ values.owner }}"

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
