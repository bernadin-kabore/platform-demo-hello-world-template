# Argo Rollouts canary, replacing a plain Deployment: traffic shifts
# gradually (20% -> 50% -> 100%) between the "stable" and "canary"
# Kubernetes Services via Istio's traffic-splitting, gated by the
# istio-success-rate ClusterAnalysisTemplate (platform-demo-gitops
# apps/argo-rollouts) which queries Prometheus for the canary's live error
# rate and aborts automatically if it regresses.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: {{ include "app.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
              name: http
          # OTel configuration is injected here, not baked into the image, so
          # the same immutable artifact can be promoted across environments.
          # OTEL_RESOURCE_ATTRIBUTES carries the attributes the SDK cannot
          # discover on its own; everything Kubernetes-derived (namespace, pod,
          # node, deployment) is added by the collector's k8sattributes
          # processor instead of being duplicated here.
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ include "app.name" . }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name={{ .Values.otel.environment }},service.namespace={{ .Values.otel.serviceNamespace | default .Values.owner }},service.version={{ .Values.image.tag }}"
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem above is enforced with everything still
        # needing *somewhere* writable — the JVM's embedded Tomcat in
        # particular won't boot without one — rather than a per-language
        # exception to the PSS-restricted policy.
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      canaryService: {{ include "app.name" . }}-canary
      stableService: {{ include "app.name" . }}
      trafficRouting:
        istio:
          virtualService:
            name: {{ include "app.name" . }}
            routes: [primary]
          destinationRule:
            name: {{ include "app.name" . }}
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        # tpl, not toYaml: the analysis arguments reference the release's own
        # name and namespace, which are not known until render time.
        {{- tpl (toYaml .Values.rollout.canary.steps) . | nindent 8 }}
