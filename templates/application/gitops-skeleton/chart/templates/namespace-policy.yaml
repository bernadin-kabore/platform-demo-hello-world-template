apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-default
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.namespacePolicy.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.namespacePolicy.quota.requestsMemory | quote }}
    limits.memory: {{ .Values.namespacePolicy.quota.limitsMemory | quote }}
    pods: {{ .Values.namespacePolicy.quota.pods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-default
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.namespacePolicy.defaults.requestCpu | quote }}
        memory: {{ .Values.namespacePolicy.defaults.requestMemory | quote }}
      default:
        memory: {{ .Values.namespacePolicy.defaults.limitMemory | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-ingress
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
